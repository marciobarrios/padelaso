project_id = "padelaso"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000", "padelaso-dev://auth/callback", "padelaso-test://auth/callback"]
enable_manual_linking = true
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

# MAR-98: OAuth 2.1 server for the MCP endpoint. Supabase sends users to
# site_url + authorization_url_path with an authorization_id. Clients are
# registered manually; dynamic registration stays off (see apps/app/MCP.md).
[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false
